<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="238" fill="#FAF8F5" stroke="#0C3B2E" stroke-width="12" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#0C3B2E" stroke-width="4" stroke-dasharray="6,6" />

  <!-- Outer Ring Dividers -->
  <path d="M 40 230 L 460 230" stroke="#0C3B2E" stroke-width="5" />
  <path d="M 40 305 L 460 305" stroke="#0C3B2E" stroke-width="5" />

  <!-- Top Pine Trees Silhouette -->
  <g fill="#0C3B2E">
    <!-- Center Main Tree -->
    <polygon points="250,65 220,120 230,120 210,160 222,160 195,210 305,210 278,160 290,160 270,120 280,120" />
    <rect x="242" y="210" width="16" height="15" />

    <!-- Left Flanking Tree 1 -->
    <polygon points="180,110 160,150 168,150 150,180 158,180 140,215 220,215 202,180 210,180 192,150 200,150" />
    <!-- Left Flanking Tree 2 -->
    <polygon points="125,145 110,175 116,175 102,195 107,195 95,218 155,218 143,195 148,195 134,175 140,175" />

    <!-- Right Flanking Tree 1 -->
    <polygon points="320,110 300,150 308,150 290,180 298,180 280,215 360,215 342,180 350,180 332,150 340,150" />
    <!-- Right Flanking Tree 2 -->
    <polygon points="375,145 360,175 366,175 352,195 357,195 345,218 405,218 393,195 398,195 384,175 390,175" />
  </g>

  <!-- Ground Line under trees -->
  <path d="M 80 220 Q 250 232 420 220" fill="none" stroke="#0C3B2E" stroke-width="4" />

  <!-- Central Typography: EVERGREEN -->
  <text x="250" y="284" 
        font-family="'Playfair Display', 'Georgia', 'Times New Roman', serif" 
        font-size="52" 
        font-weight="900" 
        fill="#0C3B2E" 
        letter-spacing="5" 
        text-anchor="middle">EVERGREEN</text>

  <!-- Coffee Cup & Steam in Lower Center -->
  <g transform="translate(250, 355)">
    <!-- Steam Lines -->
    <path d="M -12 -38 Q -6 -48 -12 -58" fill="none" stroke="#0C3B2E" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 0 -42 Q 6 -52 0 -62" fill="none" stroke="#0C3B2E" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 12 -38 Q 18 -48 12 -58" fill="none" stroke="#0C3B2E" stroke-width="3.5" stroke-linecap="round" />

    <!-- Cup Body -->
    <path d="M -26 -30 L 26 -30 C 26 0 16 16 0 16 C -16 16 -26 0 -26 -30 Z" fill="#0C3B2E" />
    <!-- Cup Handle -->
    <path d="M 26 -22 C 40 -22 40 -4 26 -4" fill="none" stroke="#0C3B2E" stroke-width="5" stroke-linecap="round" />
    <!-- Saucer -->
    <path d="M -34 22 C -34 22 0 27 34 22" fill="none" stroke="#0C3B2E" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Leaves Accent Beside Coffee Cup -->
  <g fill="#0C3B2E">
    <!-- Left Leaves -->
    <path d="M 170 340 Q 140 330 130 355 Q 160 365 170 340 Z" />
    <path d="M 190 355 Q 165 350 155 370 Q 180 380 190 355 Z" />
    <path d="M 140 325 Q 115 310 110 330 Q 130 345 140 325 Z" />

    <!-- Right Leaves -->
    <path d="M 330 340 Q 360 330 370 355 Q 340 365 330 340 Z" />
    <path d="M 310 355 Q 335 350 345 370 Q 320 380 310 355 Z" />
    <path d="M 360 325 Q 385 310 390 330 Q 370 345 360 325 Z" />
  </g>

  <!-- Curved Text Path for CAFE & RESTAURANT -->
  <path id="bottomTextPath" d="M 75 270 A 185 185 0 0 0 425 270" fill="none" stroke="none" />

  <text font-family="'Inter', 'Montserrat', 'Helvetica', sans-serif" 
        font-size="26" 
        font-weight="800" 
        fill="#0C3B2E" 
        letter-spacing="6">
    <textPath href="#bottomTextPath" startOffset="50%" text-anchor="middle">
      • CAFE &amp; RESTAURANT •
    </textPath>
  </text>
</svg>
